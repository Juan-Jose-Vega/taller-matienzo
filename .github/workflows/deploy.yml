name: Publicar Taller Matienzo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MVP/taller-matienzo-mvp-vue/package-lock.json

      - name: Instalar dependencias
        working-directory: MVP/taller-matienzo-mvp-vue
        run: npm ci

      - name: Compilar proyecto
        working-directory: MVP/taller-matienzo-mvp-vue
        run: npm run build

      - name: Preparar publicación
        uses: actions/upload-pages-artifact@v3
        with:
          path: MVP/taller-matienzo-mvp-vue/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
